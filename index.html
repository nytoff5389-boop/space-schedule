<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ตารางเรียนอวกาศ</title>
<meta name="description" content="ตารางเรียน ภาค 2/2569 ธีมอวกาศ พร้อมแจ้งเตือนผ่าน ntfy">
<meta name="theme-color" content="#04040c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ตารางเรียน">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai+Looped:wght@400;500;600&family=Orbitron:wght@600;800&family=Prompt:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="bg" aria-hidden="true"></div>
<canvas id="space" aria-hidden="true"></canvas>
<canvas id="planets" aria-hidden="true"></canvas>
<div class="sun" aria-hidden="true"></div>

<div class="app">
  <header class="hud">
    <div class="hud-left">
      <div class="hud-label" id="hudTerm">ภาค 2/2569</div>
      <div class="hud-date" id="hudDate">…</div>
    </div>
    <div class="hud-clock" id="hudClock">--:--</div>
    <button class="icon-btn" id="soundBtn" aria-label="เปิด/ปิดเสียง"></button>
  </header>

  <div class="ship-stage" aria-hidden="true">
    <canvas class="ship" id="ship"></canvas>
  </div>

  <main id="view" class="view" tabindex="-1"></main>

  <nav class="console" aria-label="เมนูหลัก">
    <button class="nav-btn" data-view="today"><span class="nav-ico"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"/><path d="M12 1v3M12 20v3M1 12h3M20 12h3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg></span><span>วันนี้</span></button>
    <button class="nav-btn" data-view="week"><span class="nav-ico"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M3 9h18M8 4v16M13 4v16"/></svg></span><span>ตาราง</span></button>
    <button class="nav-btn" data-view="month"><span class="nav-ico"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 2v5M16 2v5"/><circle cx="8" cy="15" r="1.2"/><circle cx="12" cy="15" r="1.2"/><circle cx="16" cy="15" r="1.2"/></svg></span><span>ปฏิทิน</span></button>
    <button class="nav-btn" data-view="exams"><span class="nav-ico"><svg viewBox="0 0 24 24"><path d="M6 3h9l4 4v14H6z"/><path d="M15 3v4h4M9 12h7M9 16h5"/></svg></span><span>สอบ</span></button>
    <button class="nav-btn" data-view="alerts"><span class="nav-ico"><svg viewBox="0 0 24 24"><path d="M6 16V11a6 6 0 0 1 12 0v5l2 2H4z"/><path d="M10 21a2 2 0 0 0 4 0"/></svg></span><span>แจ้งเตือน</span></button>
  </nav>
</div>
<script type="module" src="js/app.js"></script>
</body>
</html>
