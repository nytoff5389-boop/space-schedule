name: Deploy website

on:
  push:
    branches: [main]
  schedule:
    # Hourly refresh of the Thai Meteorological Department feeds used by /weather.
    # GitHub often starts scheduled runs late; the page also reads live model data itself.
    - cron: '41 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Build and upload in one job, deploy in a second job. GitHub sometimes needs a
  # moment before a freshly uploaded artifact is visible to deploy-pages; when
  # both ran back to back in one job, a scheduled run failed with
  # 'No artifacts named "github-pages" were found' even though the upload succeeded.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Copy TMD weather feeds for /weather
        continue-on-error: true
        run: node weather/fetch-tmd.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.retry.outputs.page_url }}
    steps:
      - id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4
      - name: Wait before retrying
        if: steps.deployment.outcome == 'failure'
        run: sleep 30
      - id: retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
