name: ntfy notifications

on:
  schedule:
    # 04:00 Bangkok (21:00 UTC). A second run at 05:45 Bangkok is a backup in case
    # GitHub delays the first one; already-scheduled messages are skipped.
    - cron: '0 21 * * *'
    - cron: '45 22 * * *'
  workflow_dispatch:
    inputs:
      test:
        description: 'Send a test notification now'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Send test notification
        if: ${{ inputs.test }}
        run: |
          node -e '
          const d = require("./data/schedule.json");
          fetch(d.ntfy.server, { method: "POST", headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ topic: d.ntfy.topic, title: "🛸 ทดสอบระบบแจ้งเตือน", message: "เชื่อมต่อสำเร็จ! จะได้รับแจ้งเตือนตารางเรียนจากช่องทางนี้", priority: 4, click: d.siteUrl }) })
            .then(r => console.log("status", r.status));'
      - name: Schedule today's notifications
        run: node notify/send.mjs
      - name: Keep the schedule alive
        # GitHub pauses scheduled workflows after 60 days without repository activity,
        # so record a tiny heartbeat commit on the 1st and 15th of each month.
        if: github.event_name == 'schedule'
        run: |
          d=$(TZ=Asia/Bangkok date +%d)
          if [ "$d" = "01" ] || [ "$d" = "15" ]; then
            TZ=Asia/Bangkok date -Iseconds > .heartbeat
            git config user.name github-actions
            git config user.email github-actions@users.noreply.github.com
            git add .heartbeat
            git commit -m "heartbeat [skip ci]" && git push || true
          fi
